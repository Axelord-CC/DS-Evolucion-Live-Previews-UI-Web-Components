<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<title>DS Evolucion - Live Preview Web UI Components</title>
<style>
  /* ======================================================================
     TOKENS
     Extraídos directo del componente maestro (node 17915:2087) y del átomo
     de estados .Tabs/single-tab (node 1121:234) vía Figma MCP.
     ⚠️ --color-font-default y --color-font-soft aquí salen ligeramente
     distintos a los que traíamos anotados de la auditoría global anterior
     (#252A2D/#5E6A71 vs los #292D32/#586979 leídos ahora directo del
     componente). Dejo los leídos directo del componente porque son los que
     de verdad están enlazados aquí, pero vale la pena que lo confirmes
     contra la auditoría de Temas Globales Color, puede que sea drift real.
     ====================================================================== */
  :root {
    --color-bg-body: #F3F3F2;               /* real, sin cambio */
    --color-surface: #FFFFFF;               /* real, sin cambio */
    --color-border-default: #D8DADA;        /* real, Steel/10 — confirmado en Divider de Tabs */

    --color-font-default: #292D32;          /* real — color/font/default (Hover y Focus) */
    --color-font-soft: #586979;             /* real — color/font/soft (Inactive) */
    --color-font-primary: #D50057;          /* real — color/font/primary (Active) */
    --color-font-primary-strong: #910048;   /* real — color/font/primary-strong (Pressed) */
    --color-font-disable-soft: #BAC8D7;     /* real — color/font/disable-soft (Disabled) */

    --color-bg-primary-default: #D50057;    /* real — indicador en Active */
    --color-bg-primary-strong: #910048;     /* real — indicador en Pressed */
    --color-bg-body-press: rgba(153,158,165,0.1); /* real — fondo del tab en Pressed */
    --color-border-stronger: #292D32;       /* real — anillo de foco */

    --radius-xsm: 4px;   /* real — border/radius/x-sm, esquinas del indicador */
    --radius-sm: 8px;    /* real — border/radius/sm, anillo de foco */
    --space-xxsm: 4px;   /* real — space/xx-sm (el token de Figma es 4px) */
    --tab-icon-gap: 8px; /* ⚠️ ajuste intencional pedido por Axel: 8px en vez del token real de 4px */
    --space-xsm: 8px;    /* real — space/x-sm, padding interno de cada tab */
    --space-md: 16px;    /* real — space/md, gap entre tabs (Fixed) y padding del contenedor */
    --space-xlg: 24px;   /* real — space/x-lg, gap entre tabs (Scrolling) */

    --color-primary: #D50057; /* alias usado por el motor genérico (acento UI) */

    /* ======================================================================
       TOKENS — Breadcrumb (nodo del átomo Link 1119:154 y set Breadcrumb
       17382:5444, archivo 3.3.5-Breadcrumb). Auditados contra boundVariables
       reales vía Variables API, no contra el hex de fallback del código
       generado. Sin drift encontrado entre fallback y valor resuelto.
       ⚠️ --bc-color-font-soft (Color/Font/Soft, #666e77) NO coincide con
       --color-font-soft ya definido arriba para Tabs (#586979). Son el mismo
       nombre de rol pero valores distintos leídos directo de cada componente,
       posible drift real entre Tabs y Breadcrumb que vale la pena confirmar
       contra la auditoría de Temas Globales Color. Por eso uso variables
       separadas con prefijo bc- en vez de reusar/pisar las de Tabs. */
    --bc-color-font-link: #005D97;         /* real — Color/Font/Link (Past page Default) */
    --bc-color-font-link-strong: #06304B;  /* real — Color/Font/Link-Strong (Hover y Focus, mismo color en ambos) */
    --bc-color-font-link-soft: #33BBE0;    /* real — Color/Font/Link-Soft (Pressed, es más claro, no más oscuro) */
    --bc-color-font-disable: #666E77;      /* real — Color/Font/Disable (variante "No page") */
    --bc-color-font-soft: #666E77;         /* real — Color/Font/Soft (Divider y Overflow "...") ⚠️ ver nota arriba */
    --bc-color-border-link-strong: #06304B;/* real — Color/Border/Link-Strong (anillo de foco) */
    --bc-space-xxx-sm: 2px;                /* real — Space/xxx-sm, padding vertical de cada link */
    --bc-border-weight-md: 1px;            /* real — Border/Weight/md, grosor del anillo de foco */

    /* ======================================================================
       TOKENS — Chips (component set 1162:5962, archivo 3.4.1-Chips
       cTn9ipA6fHAPs6WEzrFy8o). Auditoría de solo lectura sobre las 24
       variantes (Size × State × Selected) + 4 estados del ícono
       .Chip/delete-button. 0 hardcodes, 0 legacy Styles — audit limpio.
       ⚠️ CORRECCIÓN: los hex de esta sección se recalcularon una vez.
       La primera pasada resolvía cada variable caminando su cadena de alias
       y tomando el primer "modo" disponible de forma arbitraria — pero el
       archivo de primitivos tiene múltiples modos de marca, y ese primer
       modo no es necesariamente el aplicado en este archivo. Resultado:
       varios hex quedaron mal (ej. border-default salió #CACCCE en vez del
       real #D9E0EA). Los valores de abajo se re-leyeron directo del color
       ya compuesto en cada nodo (fills[0].color / strokes[0].color), que es
       la fuente confiable independientemente de cuántos modos tenga la
       variable. La numeración de spacing/radius/tipografía NO se vio
       afectada (esos siempre se leyeron directo de propiedades del nodo,
       nunca por cadena de alias), así que no cambian.
       ⚠️ Font/Family/body resuelve a "Inter" pero el texto real renderizado
       (leído directo de fontName, no de la variable) es Poppins. Por
       decisión de Axel, uso Poppins aquí; pendiente que el equipo corrija
       la variable.
       ⚠️ Pressed+Selected=Yes usa Color/Font/Default (texto oscuro) en vez
       de Color/Font/Primary-Strong como Hover/Focus+Selected=Yes, y no
       tiene stroke — no lo normalicé, refleja tal cual lo que hay en Figma;
       posible inconsistencia a confirmar con diseño.
       ====================================================================== */
    --chip-color-bg-zero: #FFFFFF;             /* real — Color/Background/Body/Zero */
    --chip-color-bg-hover: #F0F3F5;            /* real — Color/Background/Body/Hover (también en Focus/Focus-close, cuerpo sin seleccionar) */
    --chip-color-bg-press: rgba(153,158,165,0.1); /* real — Color/Background/Body/Press */
    --chip-color-bg-primary-softer: #FEE0EC;   /* real — Color/Background/Primary/Softer (Selected=Yes, CONSTANTE en todos los estados de interacción) */
    --chip-color-bg-disable: #D9E0EA;          /* real — Color/Background/Body/Disable (Disabled, Selected=No) */
    --chip-color-bg-disable-selected: #BAC8D7; /* real — fondo DISTINTO para Disabled+Selected=Yes (no es el rosa de Selected, ver Disabled) */

    --chip-color-border-default: #D9E0EA;      /* real — Color/Border/Default */
    --chip-color-border-primary: #D50057;      /* real — Color/Border/Primary (Selected=Yes, Enabled) */
    --chip-color-border-primary-strong: #910048; /* real — Color/Border/Primary-Strong (Selected=Yes, Hover/Focus) */
    --chip-color-border-stronger: #292D32;     /* real — Color/Border/Stronger (anillo de foco, Selected=No) */
    --chip-color-border-disable: #8697A7;      /* real — Color/Border/Disable */

    --chip-color-font-default: #292D32;        /* real — Color/Font/Default (coincide con el de Tabs; la "diferencia" que reporté antes era el mismo bug de modo arbitrario, no drift real) */
    --chip-color-font-primary: #D50057;        /* real — Color/Font/Primary */
    --chip-color-font-primary-strong: #910048; /* real — Color/Font/Primary-Strong */
    --chip-color-font-disable: #8697A7;        /* real — Color/Font/Disable */

    --chip-color-icon-default: #292D32;        /* real — Color/Icon/Default */
    --chip-color-icon-primary: #D50057;        /* real — Color/Icon/Primary */

    --chip-space-xxsm: 4px;   /* real — Space/xx-sm, padding interno del ícono de cerrar (ambos tamaños) */
    --chip-space-xsm: 8px;    /* real — Space/x-sm, gap texto↔ícono y padding V de Medium / padding V... ver por tamaño abajo */
    --chip-space-sm: 12px;    /* real — Space/sm */
    --chip-space-md: 16px;    /* real — Space/md */
    --chip-radius-pill: 999px; /* real — Border/Radius/x-lg */
    --chip-border-weight: 1px; /* real — Border/Weight/md */
    --chip-border-weight-focus: 2px; /* real — el borde del CUERPO engrosa a 2px solo en Focus (confirmado leyendo strokeWeight del nodo, Selected=No y Sí) */
    --chip-focus-ring-inset: 4px; /* real — offset del "Focus ring" interno respecto al borde del chip (nodo rectángulo aparte, x=4/y=4 sobre una caja de 133×46) */
    --chip-focus-ring-weight: 1px; /* real — stroke propio del Focus ring interno */

    /* Medium: padding 12px 16px (V=sm, H=md), font 16px/22px, ícono cerrar 20×20.
       Small:  padding 8px 12px (V=x-sm, H=sm), font 14px/19px (Body/Small,
       token DISTINTO al de Medium, no el mismo resuelto por modo), ícono 16×16.
       min-width por tamaño (Small 40px, Medium 48px — ver Anatomía) /
       max-width 280px en ambos tamaños (Propiedades). */

    --engine-panel-bg: #1C1C1C;
    --engine-panel-fg: #E8E8E6;
    --engine-accent: #D50057;
    --engine-warn: #FDBA74;
    --engine-mono: 'SFMono-Regular', Consolas, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--color-bg-body);
    color: var(--color-font-default);
  }

  header {
    flex-shrink: 0;
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--color-border-default);
    background: var(--color-surface);
  }
  header h1 { margin: 0 0 4px; font-size: 24px; font-family: 'Poppins', 'Segoe UI', sans-serif; font-weight: 600; color: var(--color-primary); }
  header p { margin: 0; font-size: 13px; color: var(--color-font-soft); }

  .layout {
    display: flex;
    align-items: stretch;
    flex: 1;
    min-height: 0;
    gap: 0;
  }

  /* ---- Sidebar de navegación de componentes (nuevo, motor genérico) ---- */
  .nav-sidebar {
    width: 140px;
    flex: 0 0 140px;
    background: #292D32;
    color: var(--engine-panel-fg);
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 14px;
    font-size: 13px;
    border-right: 1px solid #2a2a28;
    display: flex;
    flex-direction: column;
    transition: width 0.15s ease, flex-basis 0.15s ease, padding 0.15s ease, border-color 0.15s ease;
  }
  .nav-sidebar.collapsed {
    width: 0;
    flex: 0 0 0;
    padding-left: 0;
    padding-right: 0;
    border-right-color: transparent;
    overflow: hidden;
  }
  .nav-sidebar h2 {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #9a9a97;
    margin: 0 0 12px;
    white-space: nowrap;
  }
  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .nav-list button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    background: transparent;
    color: var(--engine-panel-fg);
    border: none;
    border-left: 3px solid transparent;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-list button:hover { background: #1f1f1d; }
  .nav-list button.active {
    background: #1f1f1d;
    border-left-color: var(--engine-accent);
    color: var(--engine-accent);
    font-weight: 600;
  }

  .nav-collapse-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid var(--color-border-default);
    border-radius: 6px;
    color: var(--color-font-default);
    cursor: pointer;
  }
  .nav-collapse-btn:hover { border-color: var(--engine-accent); color: var(--engine-accent); }

  /* ---- Panel de controles (motor, genérico) ---- */
  .controls-panel {
    width: 300px;
    flex: 0 0 300px;
    background: var(--color-surface);
    color: var(--color-font-default);
    height: 100%;
    overflow-y: auto;
    padding: 20px;
    font-size: 13px;
    border-right: 1px solid var(--color-border-default);
  }
  .controls-panel-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--color-border-default);
  }
  .controls-panel-title {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--color-font-default);
    margin: 0;
  }
  .controls-panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-font-soft);
    margin: 20px 0 10px;
  }
  .controls-panel h2:first-child { margin-top: 0; }

  .engine-select {
    width: 100%;
    padding: 9px 10px;
    background: #F5F7F9;
    color: var(--color-font-default);
    border: 1px solid var(--color-border-default);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23586979'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
  }
  .engine-select:hover { border-color: var(--engine-accent); }
  .engine-select:focus { outline: none; border-color: var(--engine-accent); }

  .slider-row { margin-bottom: 4px; }
  .slider-row label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--color-font-default);
  }
  .slider-row label span.value {
    font-family: var(--engine-mono);
    color: var(--engine-accent);
  }
  input[type="range"] { width: 100%; accent-color: var(--engine-accent); }

  .preset-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .preset-list button {
    text-align: left;
    padding: 9px 10px;
    background: #F5F7F9;
    color: var(--color-font-default);
    border: 1px solid var(--color-border-default);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .preset-list button:hover { border-color: var(--engine-accent); }

  .per-item-text-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .per-item-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--color-border-default);
  }
  .per-item-block:last-child { border-bottom: none; padding-bottom: 0; }
  .per-item-block:first-child { padding-top: 0; }

  .per-item-header-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .per-item-text-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toggle-switch-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-switch {
    position: relative;
    width: 30px;
    height: 17px;
    flex-shrink: 0;
  }
  .toggle-switch input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
  }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: #CBD2D9;
    border-radius: 999px;
    transition: background 0.15s ease;
  }
  .toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: transform 0.15s ease;
  }
  .toggle-switch input:checked ~ .toggle-track { background: var(--engine-accent); }
  .toggle-switch input:checked ~ .toggle-track .toggle-thumb { transform: translateX(13px); }
  .toggle-switch-label {
    font-size: 12px;
    color: var(--color-font-soft);
  }

  .per-item-text-index {
    width: 14px;
    flex-shrink: 0;
    color: var(--color-font-soft);
    font-family: var(--engine-mono);
    font-size: 11px;
  }
  .engine-text-input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    background: #F5F7F9;
    color: var(--color-font-default);
    border: 1px solid var(--color-border-default);
    border-radius: 6px;
    font-size: 12px;
  }
  .engine-text-input::placeholder { color: var(--color-font-soft); }
  .engine-text-input:focus { outline: none; border-color: var(--engine-accent); }

  .live-values {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--color-border-default);
    font-family: var(--engine-mono);
    font-size: 11.5px;
    line-height: 1.7;
  }
  .live-values .row { display: flex; justify-content: space-between; gap: 8px; }
  .live-values .k { color: var(--color-font-soft); }
  .live-values .v { color: var(--engine-accent); text-align: right; }
  .live-values .v.warn { color: #B45309; }

  /* ---- Zona de preview ---- */
  .preview-zone {
    flex: 1;
    height: 100%;
    overflow-y: hidden;
    overflow-x: auto;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .width-ruler-wrap {
    width: 100%;
    max-width: 1600px;
    margin-bottom: 20px;
  }
  .ruler-marks {
    position: relative;
    height: 14px;
    margin-top: 4px;
  }
  .ruler-marks span {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--color-font-soft);
    font-family: var(--engine-mono);
    white-space: nowrap;
  }
  .ruler-marks span:first-child { transform: translateX(0); }
  .ruler-marks span:last-child { transform: translateX(-100%); }

  .preview-frame-outer {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .preview-frame {
    transition: width 0.05s linear;
  }
  .preview-frame-label {
    text-align: center;
    font-size: 11px;
    color: var(--color-font-soft);
    margin-top: 10px;
    font-family: var(--engine-mono);
  }

  /* ---- Ventana envolvente del live preview (motor, genérico) ----
     Le da aire alrededor del componente y sirve para probarlo contra
     distintos fondos de página, no solo el blanco de su propia superficie. */
  .viewport-window {
    position: relative;
    width: 100%;
    max-width: 1600px;
    padding: 56px 40px;
    border-radius: 14px;
    border: 1px solid var(--color-border-default);
    background: #FFFFFF;
    display: flex;
    justify-content: center;
    overflow-x: auto;
    transition: background 0.15s ease;
  }

  .viewport-edge-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1px dashed var(--color-border-default);
    pointer-events: none;
    transition: left 0.05s linear;
  }

  .viewport-bg-label {
    width: 100%;
    max-width: 1600px;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-font-soft);
    margin-top: 20px;
    margin-bottom: 8px;
  }
  .viewport-bg-picker {
    width: 100%;
    max-width: 1600px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .viewport-bg-swatch {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--color-border-default);
    background: var(--color-surface);
    cursor: pointer;
    font-size: 11.5px;
    color: var(--color-font-soft);
    font-family: var(--engine-mono);
  }
  .viewport-bg-swatch:hover { border-color: var(--engine-accent); }
  .viewport-bg-swatch.active {
    border-color: var(--engine-accent);
    color: var(--color-font-default);
    font-weight: 600;
  }
  .viewport-bg-swatch .swatch-dot {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1px solid var(--color-border-default);
    flex-shrink: 0;
  }

  /* ======================================================================
     COMPONENTE — Tabs (esto es lo único específico de Tabs en todo el CSS)
     ====================================================================== */
  .tabs-bar {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--color-border-default);
    padding: 0 var(--space-md);
    gap: var(--space-md);
  }
  .tabs-bar.tabs-fixed {
    justify-content: center;
    width: 100%;
    min-width: 288px;
    max-width: 480px;
    margin: 0 auto;
  }
  .tabs-bar.tabs-scrolling {
    overflow-x: auto;
    gap: var(--space-xlg);
    scrollbar-width: none;    /* Firefox */
    -ms-overflow-style: none; /* Edge legacy */
  }
  .tabs-bar.tabs-scrolling::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  .tab-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--tab-icon-gap);
    min-width: 80px;
    max-width: 280px;
    padding: var(--space-xsm);
    background: transparent;
    border: none;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 18px;
    line-height: 24px;
    font-weight: 400;
    color: var(--color-font-soft);
    cursor: pointer;
    text-align: center;
  }
  .tabs-fixed .tab-item { flex: 1 1 0; }
  .tabs-scrolling .tab-item { flex: 0 0 auto; width: max-content; }

  .tab-label {
    min-width: 0;
    /* flex-grow en 0 a propósito: en Fixed tabs el tab-item se estira para
       repartir el ancho total, y si el label también crece, el texto se
       centra dentro de su propia caja estirada en vez de quedar pegado al
       ícono. Con flex-grow 0, el grupo ícono+texto queda compacto y es ESE
       grupo el que se centra dentro del tab (vía justify-content del padre). */
    flex: 0 1 auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    color: inherit;
  }

  .tab-indicator {
    position: absolute;
    left: var(--space-xsm);
    right: var(--space-xsm);
    bottom: 0;
    height: 2px;
    background: transparent;
    border-radius: var(--radius-xsm) var(--radius-xsm) 0 0;
  }

  /* Orden importa: cada estado pisa al anterior según prioridad real de la especificación */
  .tab-item:hover:not(.active) { color: var(--color-font-default); }

  .tab-item:focus-visible {
    outline: none;
    color: var(--color-font-default);
    border-radius: var(--radius-sm);
    box-shadow: inset 0 0 0 2px var(--color-border-stronger);
  }

  .tab-item.active {
    color: var(--color-font-primary);
    font-weight: 600;
  }
  .tab-item.active .tab-indicator { background: var(--color-bg-primary-default); }

  .tab-item:active {
    background: var(--color-bg-body-press);
    color: var(--color-font-primary-strong);
    font-weight: 600;
  }
  .tab-item:active .tab-indicator { background: var(--color-bg-primary-strong); }

  .tab-item.disabled {
    color: var(--color-font-disable-soft);
    cursor: default;
    pointer-events: none;
  }

  /* ======================================================================
     COMPONENTE — Breadcrumb (esto es lo único específico de Breadcrumb
     en todo el CSS). Estructura: grupos [Link + Divider] en fila, terminando
     siempre en Current page (no interactivo). En Mobile se colapsa a un solo
     link con ícono de flecha hacia atrás.
     ====================================================================== */
  .breadcrumb-bar {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: var(--space-xsm);
  }

  .bc-item-group {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    gap: var(--space-xsm);
  }

  .bc-link {
    display: inline-flex;
    align-items: flex-start;
    box-sizing: border-box;
    padding: var(--bc-space-xxx-sm) var(--space-xxsm);
    border: var(--bc-border-weight-md) solid transparent;
    border-radius: var(--radius-xsm);
    background: none;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 22px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Past page (Default / Hover / Focus / Pressed) — orden importa, cada
     estado pisa al anterior según prioridad real de la especificación. */
  .bc-link.bc-link-default {
    color: var(--bc-color-font-link);
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
  }
  .bc-link.bc-link-default:hover {
    color: var(--bc-color-font-link-strong);
  }
  .bc-link.bc-link-default:focus-visible {
    outline: none;
    color: var(--bc-color-font-link-strong);
    border-color: var(--bc-color-border-link-strong);
  }
  .bc-link.bc-link-default:active {
    color: var(--bc-color-font-link-soft);
  }

  /* "No page" — item de jerarquía marcado como no navegable a propósito.
     ⚠️ Esta variante no aparece en ningún ejemplo de la documentación actual
     del componente (Anatomía solo lista Home link, Divider, Links de
     jerarquía, Página actual, Ellipsis y Mobile) — se deja disponible aquí
     como control opcional, pendiente de confirmar su uso real con diseño. */
  .bc-link.bc-link-nopage {
    color: var(--bc-color-font-disable);
    font-weight: 400;
    text-decoration: none;
    cursor: default;
    pointer-events: none;
  }

  .bc-current {
    display: inline-flex;
    align-items: flex-start;
    box-sizing: border-box;
    padding: var(--bc-space-xxx-sm) var(--space-xxsm);
    color: var(--color-font-default);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 22px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .bc-divider,
  .bc-overflow {
    color: var(--bc-color-font-soft);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 22px;
    text-align: center;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .bc-mobile-link {
    display: flex;
    align-items: center;
    gap: var(--space-xsm);
    flex-shrink: 0;
  }
  .bc-chevron {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--bc-color-font-link);
  }

  /* ======================================================================
     COMPONENTE — Chips (esto es lo único específico de Chips en todo el
     CSS). El "State" del componente se fuerza vía clase (no :hover/:active
     reales) porque la documentación pide un selector explícito de estado,
     a diferencia de Tabs/Breadcrumb donde el estado surge de interacción
     real del usuario.
     ====================================================================== */
  .chip-el {
    position: relative;
    display: inline-flex;
    align-items: center;
    box-sizing: border-box;
    border-radius: var(--chip-radius-pill);
    border: var(--chip-border-weight) solid var(--chip-color-border-default);
    background: var(--chip-color-bg-zero);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-weight: 400;
    color: var(--chip-color-font-default);
    max-width: 280px;
    cursor: pointer;
    user-select: none;
  }
  .chip-el:focus { outline: none; } /* el anillo real lo dibuja :focus-visible más abajo */

  /* Ancho mínimo por tamaño (actualizado a pedido de Axel: ya no es un
     valor único de 88px compartido — cada tamaño tiene su propio mínimo). */
  .chip-el.chip-medium { padding: 12px 16px; font-size: 16px; line-height: 22px; min-width: 48px; }
  .chip-el.chip-small  { padding: 8px 12px;  font-size: 14px; line-height: 19px; min-width: 40px; }

  /* Gap texto↔ícono vía margin explícito, NO flex `gap` — algunos motores de
     render (incluido el usado para QA interno de este archivo) no aplican
     `gap` de forma confiable en contenedores flex, y el resultado se veía
     con el texto y el ícono de cerrar prácticamente pegados. Con margin el
     espaciado es explícito y no depende del soporte de esa propiedad. */
  .chip-label {
    min-width: 0;
    flex: 0 1 auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip-label.has-close { margin-right: var(--chip-space-xsm); }

  .chip-close {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 50%;
    box-sizing: border-box;
    padding: var(--chip-space-xxsm);
    color: inherit;
    cursor: pointer;
  }
  .chip-close:focus { outline: none; }
  .chip-medium .chip-close { width: 20px; height: 20px; }
  .chip-small  .chip-close { width: 16px; height: 16px; }
  .chip-close svg { width: 100%; height: 100%; display: block; }

  /* ======================================================================
     Estados — reales vía interacción (:hover, :focus-visible, :active),
     igual que Tabs/Breadcrumb. El orden de las reglas importa: cada estado
     pisa al anterior según la prioridad real auditada en Figma.
     "Focus (close)" no es una clase forzada: ocurre cuando el foco de
     teclado está genuinamente en el ícono de cerrar (elemento propio,
     focusable, es el siguiente tab-stop después del cuerpo del chip), y se
     detecta con :has() para aplicar el fondo del cuerpo sin JS extra.
     ====================================================================== */

  /* Selected = No.
     ⚠️ CORRECCIÓN: estas reglas ANTES no excluían .chip-selected, así que
     por especificidad CSS (misma cantidad de clases/pseudo-clases) le
     ganaban a la regla base .chip-selected y un chip Selected=Yes en
     Hover/Focus/Pressed perdía su fondo rosa y tomaba el gris de "no
     seleccionado" — la variante incorrecta pisando a la correcta. Con
     :not(.chip-selected) cada bloque queda estrictamente en su carril. */
  .chip-el:hover:not(.chip-disabled):not(.chip-selected),
  .chip-el:focus-visible:not(.chip-selected),
  .chip-el:has(.chip-close:focus-visible):not(.chip-selected) {
    background: var(--chip-color-bg-hover);
  }
  .chip-el:focus-visible {
    border-color: var(--chip-color-border-stronger);
    /* El borde del CUERPO engrosa a 2px (no 1px) solo en Focus — confirmado
       leyendo strokeWeight directo del nodo real, distinto del resto de
       estados que se quedan en el grosor base de 1px. */
    border-width: var(--chip-border-weight-focus);
  }
  /* "Focus ring" interno: en Figma es un rectángulo APARTE, no un efecto del
     borde del chip — insetado 4px por cada lado de la caja del chip, con su
     propio stroke de 1px y el mismo radio de pastilla. Se replica con un
     ::after absoluto en vez de box-shadow porque box-shadow inset se pega
     al borde real (0px), no deja el hueco de 4px que sí existe en Figma. */
  .chip-el:focus-visible::after {
    content: '';
    position: absolute;
    inset: var(--chip-focus-ring-inset);
    border-radius: inherit;
    border: var(--chip-focus-ring-weight) solid var(--chip-color-border-stronger);
    pointer-events: none;
  }
  .chip-el.chip-selected:focus-visible::after {
    border-color: var(--chip-color-border-primary-strong);
  }
  .chip-close:focus-visible {
    box-shadow: 0 0 0 var(--chip-border-weight) var(--chip-color-border-stronger);
  }
  .chip-el:active:not(.chip-disabled):not(.chip-selected) {
    background: var(--chip-color-bg-press);
    color: var(--chip-color-font-primary);
  }
  .chip-el:active:not(.chip-disabled):not(.chip-selected) .chip-close { color: var(--chip-color-font-primary); }

  /* Selected = Yes. El fondo (Primary/Softer) es CONSTANTE en todos los
     estados de interacción — confirmado leyendo cada variante real, no se
     toca en ninguna regla de abajo. Solo cambian borde/texto/ícono, y en
     Focus(close) puntualmente el borde desaparece del todo. */
  .chip-el.chip-selected {
    background: var(--chip-color-bg-primary-softer);
    border-color: var(--chip-color-border-primary);
    color: var(--chip-color-font-primary);
    font-weight: 600;
  }
  .chip-el.chip-selected .chip-close { color: var(--chip-color-font-primary); }
  .chip-el.chip-selected .chip-close:focus-visible {
    box-shadow: 0 0 0 var(--chip-border-weight) var(--chip-color-border-primary-strong);
  }

  .chip-el.chip-selected:hover:not(.chip-disabled),
  .chip-el.chip-selected:focus-visible,
  .chip-el.chip-selected:has(.chip-close:focus-visible) {
    color: var(--chip-color-font-primary-strong);
  }
  .chip-el.chip-selected:hover:not(.chip-disabled) .chip-close,
  .chip-el.chip-selected:focus-visible .chip-close,
  .chip-el.chip-selected:has(.chip-close:focus-visible) .chip-close {
    color: var(--chip-color-font-primary-strong);
  }
  /* Borde: Hover/Focus del CUERPO sí lo cambian a Primary-Strong; pero
     cuando el foco real está en el ícono de cerrar (Focus close) el borde
     del cuerpo desaparece por completo — dos casos distintos aunque el
     texto quede igual en ambos. */
  .chip-el.chip-selected:hover:not(.chip-disabled):not(:has(.chip-close:focus-visible)),
  .chip-el.chip-selected:focus-visible {
    border-color: var(--chip-color-border-primary-strong);
  }
  .chip-el.chip-selected:has(.chip-close:focus-visible) {
    border-color: transparent;
  }
  /* ⚠️ Pressed+Selected=Yes tal cual está en Figma: texto oscuro (Default,
     no Primary-Strong) y sin stroke — ver nota en :root. No se normaliza. */
  .chip-el.chip-selected:active:not(.chip-disabled) {
    border-color: transparent;
    color: var(--chip-color-font-default);
  }
  .chip-el.chip-selected:active:not(.chip-disabled) .chip-close { color: var(--chip-color-font-default); }

  /* Disabled — modificador booleano propio, se anula explícitamente en
     cada regla de interacción de arriba con :not(.chip-disabled).
     ⚠️ CORRECCIÓN: Disabled+Selected=Yes tiene su PROPIO fondo (#BAC8D7),
     distinto tanto del rosa de Selected como del gris de Disabled sin
     seleccionar — antes faltaba esta regla y se quedaba con el rosa
     heredado de .chip-selected. */
  .chip-el.chip-disabled {
    cursor: default;
    color: var(--chip-color-font-disable);
  }
  .chip-el.chip-disabled .chip-close { color: var(--chip-color-font-disable); }
  .chip-el.chip-disabled:not(.chip-selected) {
    background: var(--chip-color-bg-disable);
    border-color: transparent;
  }
  .chip-el.chip-disabled.chip-selected {
    background: var(--chip-color-bg-disable-selected);
    border-color: var(--chip-color-border-disable);
  }

  .chip-removed-placeholder {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border: 1px dashed var(--chip-color-border-default);
    border-radius: var(--chip-radius-pill);
    color: var(--color-font-soft);
    font-size: 13px;
  }
  .chip-restore-btn {
    border: none;
    background: none;
    color: var(--chip-color-font-primary);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

</style>
</head>
<body>

  <header>
    <h1 id="headerTitle">DS Evolución 2.0 - Web - UI Components Live Preview</h1>
    <p>Live previews de componentes (responsive, variantes y casos límite)</p>
  </header>

  <div class="layout">
    <div class="nav-sidebar" id="navSidebar"></div>
    <div class="controls-panel" id="controlsPanel"></div>

    <div class="preview-zone">
      <div class="width-ruler-wrap">
        <div class="slider-row">
          <label>Ancho del contenedor <span class="value" id="widthValueLabel">600px</span></label>
          <input type="range" id="widthSlider">
        </div>
        <div class="ruler-marks" id="rulerMarks"></div>
      </div>

      <div class="viewport-window" id="viewportWindow">
        <div class="viewport-edge-line" id="edgeLineLeft"></div>
        <div class="viewport-edge-line" id="edgeLineRight"></div>
        <div class="preview-frame-outer">
          <div class="preview-frame" id="previewFrame"><div id="componentMount"></div></div>
        </div>
      </div>
      <div class="preview-frame-label" id="previewFrameLabel"></div>
      <div class="viewport-bg-label">Color de fondo del preview</div>
      <div class="viewport-bg-picker" id="viewportBgPicker"></div>
    </div>
  </div>

<script>
/* ==========================================================================
   MOTOR GENÉRICO
   No se toca al crear un demo nuevo. Lee "componentConfig" (definido abajo)
   y genera controles, presets, panel de valores en vivo y el render loop.
   ========================================================================== */

const state = {};
let componentConfig = null;

function initEngine(config) {
  componentConfig = config;
  Object.assign(state, config.defaultState());
  setupViewportRuler(config.viewportRange);
  buildControlsPanel();
  bindWidthSlider();
  render();
}

function setupViewportRuler(range) {
  const slider = document.getElementById('widthSlider');
  slider.min = range.min;
  slider.max = range.max;
  slider.value = state.containerWidth;

  document.getElementById('widthValueLabel').textContent = state.containerWidth + 'px';

  const marksWrap = document.getElementById('rulerMarks');
  marksWrap.innerHTML = '';
  range.marks.forEach(mark => {
    const span = document.createElement('span');
    span.textContent = mark.label;
    const pct = ((mark.value - range.min) / (range.max - range.min)) * 100;
    span.style.left = pct + '%';
    marksWrap.appendChild(span);
  });
}

function buildControlsPanel() {
  const panel = document.getElementById('controlsPanel');
  panel.innerHTML = '';

  const titleRow = document.createElement('div');
  titleRow.className = 'controls-panel-title-row';

  const collapseBtn = document.createElement('button');
  collapseBtn.className = 'nav-collapse-btn';
  collapseBtn.title = navCollapsed ? 'Mostrar listado de componentes' : 'Ocultar listado de componentes';
  collapseBtn.innerHTML = navCollapsed ? NAV_CHEVRON_RIGHT_SVG : NAV_CHEVRON_LEFT_SVG;
  collapseBtn.addEventListener('click', () => {
    navCollapsed = !navCollapsed;
    document.getElementById('navSidebar').classList.toggle('collapsed', navCollapsed);
    buildControlsPanel();
  });
  titleRow.appendChild(collapseBtn);

  const title = document.createElement('h1');
  title.className = 'controls-panel-title';
  title.textContent = activeComponentName;
  titleRow.appendChild(title);

  panel.appendChild(titleRow);

  componentConfig.controls.forEach(ctrl => {
    const h2 = document.createElement('h2');
    h2.textContent = ctrl.label;
    panel.appendChild(h2);

    if (ctrl.type === 'select') {
      const options = typeof ctrl.options === 'function' ? ctrl.options(state) : ctrl.options;

      // Si el valor actual quedó fuera de las opciones válidas (ej. tabCount
      // tras cambiar Distribution), lo clampeamos al último valor disponible.
      if (!options.some(opt => String(opt) === String(state[ctrl.key]))) {
        state[ctrl.key] = ctrl.isNumeric ? Number(options[options.length - 1]) : options[options.length - 1];
      }

      const select = document.createElement('select');
      select.className = 'engine-select';
      options.forEach(opt => {
        const optionEl = document.createElement('option');
        optionEl.value = opt;
        optionEl.textContent = opt;
        if (String(state[ctrl.key]) === String(opt)) optionEl.selected = true;
        select.appendChild(optionEl);
      });
      select.addEventListener('change', (e) => {
        state[ctrl.key] = ctrl.isNumeric ? Number(e.target.value) : e.target.value;
        if (componentConfig.onChange) componentConfig.onChange(state, ctrl.key);
        buildControlsPanel();
        render();
      });
      panel.appendChild(select);
    }
  });

  // Presets
  const h2p = document.createElement('h2');
  h2p.textContent = 'Casos límite';
  panel.appendChild(h2p);
  const presetList = document.createElement('div');
  presetList.className = 'preset-list';
  componentConfig.presets.forEach(preset => {
    const btn = document.createElement('button');
    btn.textContent = preset.label;
    btn.addEventListener('click', () => {
      if (componentConfig.perItemLabels) {
        state[componentConfig.perItemLabels.key] = [];
        (componentConfig.perItemLabels.toggles || []).forEach(t => {
          state[t.key] = [];
        });
      }
      Object.assign(state, preset.state);
      document.getElementById('widthSlider').value = state.containerWidth;
      document.getElementById('widthValueLabel').textContent = state.containerWidth + 'px';
      buildControlsPanel();
      render();
    });
    presetList.appendChild(btn);
  });
  panel.appendChild(presetList);

  // Etiquetas por item (genérico: cualquier componente con conteo variable de
  // elementos puede definir "perItemLabels" en su config y aparece aquí solo).
  // Si además define "toggle", cada fila también trae un checkbox (ej. mostrar/
  // ocultar ícono) junto al texto.
  if (componentConfig.perItemLabels) {
    const cfg = componentConfig.perItemLabels;
    const count = typeof cfg.count === 'function' ? cfg.count(state) : cfg.count;
    if (!Array.isArray(state[cfg.key])) state[cfg.key] = [];
    (cfg.toggles || []).forEach(t => {
      if (!Array.isArray(state[t.key])) state[t.key] = [];
    });

    const h2labels = document.createElement('h2');
    h2labels.textContent = cfg.label;
    panel.appendChild(h2labels);

    const listWrap = document.createElement('div');
    listWrap.className = 'per-item-text-list';
    for (let i = 0; i < count; i++) {
      const block = document.createElement('div');
      block.className = 'per-item-block';

      const headerRow = document.createElement('div');
      headerRow.className = 'per-item-header-row';

      const idx = document.createElement('span');
      idx.className = 'per-item-text-index';
      idx.textContent = (i + 1) + '.';
      headerRow.appendChild(idx);

      (cfg.toggles || []).forEach(toggleCfg => {
        const toggleWrap = document.createElement('label');
        toggleWrap.className = 'toggle-switch-wrap';

        const toggleSwitch = document.createElement('span');
        toggleSwitch.className = 'toggle-switch';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        const storedVal = state[toggleCfg.key][i];
        const defaultVal = toggleCfg.default !== undefined ? toggleCfg.default : true;
        checkbox.checked = storedVal === undefined ? defaultVal : storedVal;
        checkbox.addEventListener('change', (e) => {
          state[toggleCfg.key][i] = e.target.checked;
          render();
        });

        const track = document.createElement('span');
        track.className = 'toggle-track';
        const thumb = document.createElement('span');
        thumb.className = 'toggle-thumb';
        track.appendChild(thumb);

        toggleSwitch.appendChild(checkbox);
        toggleSwitch.appendChild(track);

        const toggleText = document.createElement('span');
        toggleText.className = 'toggle-switch-label';
        toggleText.textContent = toggleCfg.title || '';

        toggleWrap.appendChild(toggleSwitch);
        toggleWrap.appendChild(toggleText);
        headerRow.appendChild(toggleWrap);
      });

      block.appendChild(headerRow);

      const textRow = document.createElement('div');
      textRow.className = 'per-item-text-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'engine-text-input';
      input.placeholder = cfg.placeholder ? cfg.placeholder(i) : ('Item ' + (i + 1));
      input.value = state[cfg.key][i] || '';
      input.addEventListener('input', (e) => {
        state[cfg.key][i] = e.target.value;
        render();
      });
      textRow.appendChild(input);
      block.appendChild(textRow);

      listWrap.appendChild(block);
    }
    panel.appendChild(listWrap);
  }

  // Live values placeholder (se rellena en render())
  const live = document.createElement('div');
  live.className = 'live-values';
  live.id = 'liveValues';
  panel.appendChild(live);
}

function bindWidthSlider() {
  const slider = document.getElementById('widthSlider');
  slider.addEventListener('input', (e) => {
    state.containerWidth = Number(e.target.value);
    document.getElementById('widthValueLabel').textContent = state.containerWidth + 'px';
    render();
  });
}

function render() {
  const frame = document.getElementById('previewFrame');
  frame.style.width = state.containerWidth + 'px';

  const mount = document.getElementById('componentMount');
  componentConfig.render(state, mount);

  document.getElementById('previewFrameLabel').textContent =
    componentConfig.describeViewport ? componentConfig.describeViewport(state) : '';

  // Panel de valores en vivo — se recalcula DESPUÉS del render para poder medir el DOM real
  const liveValuesEl = document.getElementById('liveValues');
  if (liveValuesEl && componentConfig.computeLiveValues) {
    const rows = componentConfig.computeLiveValues(state, mount);
    liveValuesEl.innerHTML = rows.map(r =>
      '<div class="row"><span class="k">' + r.label + '</span><span class="v' + (r.warn ? ' warn' : '') + '">' + r.value + '</span></div>'
    ).join('');
  }

  updateEdgeLines();
}

// Líneas guía punteadas que marcan el borde izquierdo y derecho del
// componente dentro de la ventana de preview (motor, genérico).
function updateEdgeLines() {
  const windowEl = document.getElementById('viewportWindow');
  const frameEl = document.getElementById('previewFrame');
  const lineLeft = document.getElementById('edgeLineLeft');
  const lineRight = document.getElementById('edgeLineRight');
  if (!windowEl || !frameEl || !lineLeft || !lineRight) return;

  const winRect = windowEl.getBoundingClientRect();
  const frameRect = frameEl.getBoundingClientRect();
  const scrollLeft = windowEl.scrollLeft;

  const leftPx = (frameRect.left - winRect.left) + scrollLeft;
  const rightPx = (frameRect.right - winRect.left) + scrollLeft;

  lineLeft.style.left = leftPx + 'px';
  lineRight.style.left = rightPx + 'px';
}

const BC_LABEL_SETS = {

// Regla de truncamiento documentada: 40 caracteres visibles, no es una regla
// de overflow por CSS/ancho como en Tabs.
function bcTruncate(text) {
  if (!text) return text;
  return text.length > 40 ? text.slice(0, 40) + '...' : text;
}

const breadcrumbConfig = {
  defaultState() {
    return {
      containerWidth: 900,
      pageCount: 2,
      labelLength: 'Corto',
      customLabels: Array(9).fill(''),
      noPageLinks: Array(9).fill(false)

  },

  viewportRange: {

    ]
  },

  perItemLabels: {

    count: (s) => s.pageCount,

    },
    { key: 'labelLength', type: 'select', label: 'Longitud de texto', options: ['Corto', 'Medio', 'Muy largo'] }
  ],

  presets: [
    { label: 'Full trail (cabe completo)', state: { containerWidth: 900, pageCount: 2, labelLength: 'Corto', noPageLinks: Array(9).fill(false) } },
    { label: 'Overflow trail (3+ niveles, no cabe)', state: { containerWidth: 480, pageCount: 3, labelLength: 'Corto', noPageLinks: Array(9).fill(false) } },
    { label: 'Mobile (ni overflow cabe)', state: { containerWidth: 280, pageCount: 5, labelLength: 'Medio', noPageLinks: Array(9).fill(false) } },
    { label: 'Mobile forzado (solo 2 niveles)', state: { containerWidth: 320, pageCount: 0, labelLength: 'Corto', noPageLinks: Array(9).fill(false) } },
    { label: 'Truncamiento a 40 caracteres', state: { containerWidth: 1400, pageCount: 2, labelLength: 'Muy largo', noPageLinks: Array(9).fill(false) } },
    { label: 'Item "No page" (no navegable)', state: { containerWidth: 900, pageCount: 3, labelLength: 'Corto', noPageLinks: [false, true, false, false, false, false, false, false, false] } }
  ],

  describeViewport(state) {
    let sizeLabel;
    if (state.containerWidth <= 375) sizeLabel = 'móvil (' + state.containerWidth + 'px)';
    else if (state.containerWidth <= 768) sizeLabel = 'tablet vertical (' + state.containerWidth + 'px)';
    else if (state.containerWidth <= 1024) sizeLabel = 'tablet horizontal (' + state.containerWidth + 'px)';
    else sizeLabel = 'desktop (' + state.containerWidth + 'px)';
    const diag = state._bcDiag;
    return sizeLabel + (diag && diag.deviceUsed ? ' · ' + diag.deviceUsed : '');
  },

  render(state, mount) {
    mount.innerHTML = '';

    const defaultLabels = BC_LABEL_SETS[state.labelLength];
    const customLabels = state.customLabels || [];
    const noPageLinks = state.noPageLinks || [];
    const homeLabel = 'Inicio';
    const currentLabel = 'Página actual';

    const pages = [];
    for (let i = 0; i < state.pageCount; i++) {
      const custom = (customLabels[i] || '').trim();
      const raw = custom || defaultLabels[i % defaultLabels.length];
      pages.push({
        raw: raw,
        label: bcTruncate(raw),
        truncated: raw.length > 40,
        noPage: !!noPageLinks[i]
      });
    }
    const totalLevels = 2 + pages.length; // Home + intermedios + Current

    // ---- constructores de cada variante (closures sobre pages/labels) ----
    function bcLinkEl(text, opts) {
      opts = opts || {};
      const el = document.createElement(opts.noPage ? 'span' : 'button');
      el.className = 'bc-link ' + (opts.noPage ? 'bc-link-nopage' : 'bc-link-default');
      el.textContent = text;
      el.title = text;
      if (!opts.noPage) el.type = 'button';
      else el.setAttribute('aria-disabled', 'true');
      return el;
    }
    function bcDividerEl() {
      const el = document.createElement('span');
      el.className = 'bc-divider';
      el.textContent = '/';
      return el;
    }
    function bcOverflowEl() {
      const el = document.createElement('span');
      el.className = 'bc-overflow';
      el.textContent = '...';
      return el;
    }
    function bcCurrentEl(text) {
      const el = document.createElement('span');
      el.className = 'bc-current';
      el.setAttribute('aria-current', 'page');
      el.textContent = text;
      return el;
    }
    function bcGroup(linkEl) {
      const g = document.createElement('div');
      g.className = 'bc-item-group';
      g.appendChild(linkEl);
      g.appendChild(bcDividerEl());
      return g;
    }

    function buildFullTrail() {
      const bar = document.createElement('div');
      bar.className = 'breadcrumb-bar';
      bar.id = 'bcBar';
      bar.appendChild(bcGroup(bcLinkEl(homeLabel)));
      pages.forEach(p => bar.appendChild(bcGroup(bcLinkEl(p.label, { noPage: p.noPage }))));
      bar.appendChild(bcCurrentEl(currentLabel));
      return bar;
    }

    function buildOverflowTrail() {
      const bar = document.createElement('div');
      bar.className = 'breadcrumb-bar';
      bar.id = 'bcBar';
      bar.appendChild(bcGroup(bcLinkEl(homeLabel)));
      bar.appendChild(bcGroup(bcOverflowEl()));
      const parent = pages[pages.length - 1];
      bar.appendChild(bcGroup(bcLinkEl(parent.label, { noPage: parent.noPage })));
      bar.appendChild(bcCurrentEl(currentLabel));
      return bar;
    }

    let mobileTruncated = false;
    function buildMobile() {
      const bar = document.createElement('div');
      bar.className = 'breadcrumb-bar';
      bar.id = 'bcBar';
      const group = document.createElement('div');
      group.className = 'bc-mobile-link';
      const chevron = document.createElement('span');
      chevron.className = 'bc-chevron';
      chevron.innerHTML = CHEVRON_LEFT_SVG;
      group.appendChild(chevron);
      const parentRaw = pages.length >= 1 ? pages[pages.length - 1].raw : homeLabel;
      const fullText = 'Volver a ' + parentRaw;
      mobileTruncated = fullText.length > 40;
      group.appendChild(bcLinkEl(bcTruncate(fullText)));
      bar.appendChild(group);
      return bar;
    }

    // ---- cascada real: mide ancho natural vs. contenedor disponible ----
    const fullBar = buildFullTrail();
    mount.appendChild(fullBar);
    const fullWidth = fullBar.scrollWidth;
    const available = mount.clientWidth;

    let deviceUsed, overflowWidth = null, mobileReason = null;

    if (fullWidth <= available) {
      deviceUsed = 'Desktop - full trail';
    } else {
      mount.removeChild(fullBar);
      if (pages.length >= 1) {
        const overflowBar = buildOverflowTrail();
        mount.appendChild(overflowBar);
        overflowWidth = overflowBar.scrollWidth;
        if (overflowWidth <= available) {
          deviceUsed = 'Desktop - overflow trail';
        } else {
          mount.removeChild(overflowBar);
          deviceUsed = 'Mobile';
          mobileReason = 'El overflow trail tampoco cabe en el contenedor';
          mount.appendChild(buildMobile());
        }
      } else {
        deviceUsed = 'Mobile';
        mobileReason = 'Solo hay 2 niveles de profundidad (Home + Current): la cascada salta overflow trail';
        mount.appendChild(buildMobile());
      }
    }

    state._bcDiag = {
      deviceUsed: deviceUsed,
      totalLevels: totalLevels,
      fullWidth: fullWidth,
      overflowWidth: overflowWidth,
      available: available,
      mobileReason: mobileReason,
      anyTruncated: pages.some(p => p.truncated) || (deviceUsed === 'Mobile' && mobileTruncated)
    };
  },

  computeLiveValues(state, mount) {
    const diag = state._bcDiag || {};
    const rows = [];
    rows.push({ label: 'Device aplicado (cascada real)', value: diag.deviceUsed || 'sin calcular' });
    rows.push({ label: 'Niveles de profundidad', value: diag.totalLevels });
    rows.push({ label: 'Ancho disponible (contenedor)', value: (diag.available || 0) + 'px' });
    rows.push({
      label: 'Ancho medido / Full trail',
      value: (diag.fullWidth || 0) + 'px',
      warn: diag.deviceUsed !== 'Desktop - full trail'
    });
    if (diag.overflowWidth !== null && diag.overflowWidth !== undefined) {
      rows.push({
        label: 'Ancho medido / Overflow trail',
        value: diag.overflowWidth + 'px',
        warn: diag.deviceUsed !== 'Desktop - overflow trail'
      });
    }
    if (diag.mobileReason) {
      rows.push({ label: 'Motivo de Mobile', value: diag.mobileReason, warn: true });
    }
    rows.push({ label: 'Texto truncado (40 chars)', value: diag.anyTruncated ? 'sí' : 'no', warn: diag.anyTruncated });
    return rows;
  }
};

    { label: 'Texto al mínimo (Small 40px)', state: { size: 'Small', containerWidth: 400, chipText: ['Sí'], selected: [false], showClose: [false], disabled: [false], _chipRemoved: false } },
    { label: 'Texto al máximo + elipsis', state: { size: 'Medium', containerWidth: 400, chipText: [CHIP_TEXT_PRESETS.largo], selected: [false], showClose: [false], disabled: [false], _chipRemoved: false } },
    { label: 'Selected + removible', state: { size: 'Medium', containerWidth: 400, chipText: [CHIP_TEXT_PRESETS.medio], selected: [true], showClose: [true], disabled: [false], _chipRemoved: false } },
    { label: 'Small · Disabled', state: { size: 'Small', containerWidth: 400, chipText: [CHIP_TEXT_PRESETS.corto], selected: [false], showClose: [false], disabled: [true], _chipRemoved: false } }
  ],

  describeViewport(state) {
    return 'El cambio de variante de tamaño es elección manual (contenedor ' + state.containerWidth + 'px)';
  },

  render(state, mount) {
    const text = (state.chipText && state.chipText[0] || '').trim() || CHIP_TEXT_PRESETS.corto;
    const isSelected = !!(state.selected && state.selected[0]);
    const showClose = !!(state.showClose && state.showClose[0]);
    const isDisabled = !!(state.disabled && state.disabled[0]);

    mount.innerHTML = '';

    // El chip "eliminado" (clic real en el ícono de cerrar) se representa
    // como placeholder con restauración manual, en vez de dejar el preview
    // vacío sin explicación — fiel al comportamiento documentado ("elimina
    // el chip por completo") sin perder la capacidad de seguir probando.
    if (state._chipRemoved) {
      const placeholder = document.createElement('div');
      placeholder.className = 'chip-removed-placeholder';
      placeholder.textContent = 'Chip eliminado. ';
      const restoreBtn = document.createElement('button');
      restoreBtn.type = 'button';
      restoreBtn.className = 'chip-restore-btn';
      restoreBtn.textContent = 'Restaurar';
      restoreBtn.addEventListener('click', () => {
        state._chipRemoved = false;
        render();
      });
      placeholder.appendChild(restoreBtn);
      mount.appendChild(placeholder);
      updateChipLiveValues(state, mount, { note: 'chip eliminado (clic en el ícono de cerrar)' });
      return;
    }

    const chip = document.createElement('div');
    chip.className = 'chip-el chip-' + state.size.toLowerCase() + (isSelected ? ' chip-selected' : '') + (isDisabled ? ' chip-disabled' : '');
    chip.id = 'chipEl';
    chip.setAttribute('role', 'button');
    chip.setAttribute('aria-pressed', String(isSelected));
    chip.title = text;
    chip.tabIndex = isDisabled ? -1 : 0;

    const label = document.createElement('span');
    label.className = 'chip-label' + (showClose && !isDisabled ? ' has-close' : '');
    label.textContent = text;
    chip.appendChild(label);

    // Al hacer clic en cualquier parte del chip que no sea el ícono de
    // cerrar (o Enter/Space con foco en el chip), alterna Selected — igual
    // que el componente real (ver Anatomía/Interacciones).
    function toggleSelected() {
      if (isDisabled) return;
      state.selected[0] = !state.selected[0];
      buildControlsPanel();
      render();
    }
    chip.addEventListener('click', toggleSelected);
    chip.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        toggleSelected();
      }
    });

    // Disabled no expone la acción de eliminar (ver Anatomía: "el chip al
    // estar deshabilitado no tiene opciones de close").
    if (showClose && !isDisabled) {
      const close = document.createElement('span');
      close.className = 'chip-close';
      close.innerHTML = CHIP_CLOSE_ICON_SVG;
      close.tabIndex = 0;
      close.setAttribute('role', 'button');
      close.setAttribute('aria-label', 'Eliminar chip');
      close.addEventListener('click', (e) => {
        e.stopPropagation(); // no debe además alternar Selected
        state._chipRemoved = true;
        render();
      });
      close.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          e.stopPropagation();
          state._chipRemoved = true;
          render();
        }
      });
      chip.appendChild(close);
    }

    mount.appendChild(chip);

    // El panel de "valores en vivo" se refresca en cada interacción real
    // (hover/focus/press), no solo cuando cambian los controles — si no,
    // quedaría desactualizado apenas el usuario pasa el mouse o da Tab.
    const closeEl = chip.querySelector('.chip-close');
    const liveEvents = ['mouseenter', 'mouseleave', 'mousedown', 'mouseup', 'focus', 'blur'];
    liveEvents.forEach(evt => {
      chip.addEventListener(evt, () => updateChipLiveValues(state, mount));
      if (closeEl) closeEl.addEventListener(evt, () => updateChipLiveValues(state, mount));
    });

    updateChipLiveValues(state, mount);
  },

  computeLiveValues(state, mount) {
    // El cálculo real vive en updateChipLiveValues (se dispara también por
    // eventos de interacción, no solo al final de render()); aquí solo
    // devolvemos lo último calculado para que el motor genérico tenga algo
    // que pintar en el primer render.
    return state._chipLiveRows || [];
  }
};

// Fuera del objeto de config a propósito: se llama tanto desde
// chipsConfig.render() como desde los listeners de interacción real
// (hover/focus/press), sin pasar por un render() completo del motor —
// así el anillo de foco/hover no "parpadea" al recalcular valores en vivo.
function updateChipLiveValues(state, mount, opts) {
  const chip = mount.querySelector('#chipEl');
  const rows = [];
  rows.push({ label: 'Size', value: state.size });

  if (opts && opts.note) {
    rows.push({ label: 'Estado', value: opts.note, warn: true });
  } else if (chip) {
    const closeEl = chip.querySelector('.chip-close');
    let interactionState = 'Enabled';
    if (chip.classList.contains('chip-disabled')) {
      interactionState = 'Disabled';
    } else if (closeEl && document.activeElement === closeEl) {
      interactionState = 'Focus (close)';
    } else if (chip.matches(':active')) {
      interactionState = 'Pressed';
    } else if (document.activeElement === chip && chip.matches(':focus-visible')) {
      interactionState = 'Focus';
    } else if (chip.matches(':hover')) {
      interactionState = 'Hover';
    }
    rows.push({ label: 'State (real, por interacción)', value: interactionState });
  }

  const selected = !!(state.selected && state.selected[0]);
  const showClose = !!(state.showClose && state.showClose[0]);
  const disabled = !!(state.disabled && state.disabled[0]);
  rows.push({ label: 'Selected', value: selected ? 'sí' : 'no' });
  rows.push({ label: 'Show close', value: showClose ? 'sí' : 'no' });
  rows.push({ label: 'Disabled', value: disabled ? 'sí' : 'no' });

  if (chip) {
    const w = Math.round(chip.getBoundingClientRect().width);
    const minForSize = state.size === 'Small' ? 40 : 48;
    const atMin = w <= minForSize;
    const atMax = w >= 280;
    rows.push({ label: 'Ancho del chip (medido)', value: w + 'px' });
    rows.push({
      label: 'Clamp (' + minForSize + '–280)',
      value: atMin ? 'en mínimo (' + minForSize + 'px)' : atMax ? 'en máximo (280px)' : 'dentro de rango',
      warn: atMin || atMax
    });
    const labelEl = chip.querySelector('.chip-label');
    const truncated = labelEl ? labelEl.scrollWidth > labelEl.clientWidth : false;
    rows.push({ label: 'Texto truncado (elipsis)', value: truncated ? 'sí' : 'no', warn: truncated });
  }

  state._chipLiveRows = rows;
  const liveValuesEl = document.getElementById('liveValues');
  if (liveValuesEl) {
    liveValuesEl.innerHTML = rows.map(r =>
      '<div class="row"><span class="k">' + r.label + '</span><span class="v' + (r.warn ? ' warn' : '') + '">' + r.value + '</span></div>'
    ).join('');
  }
}

/* ==========================================================================
   VENTANA DE PREVIEW — fondo ajustable (motor, genérico)
   Vive fuera del ciclo de vida del componente activo: no se resetea al
   cambiar de componente en el sidebar de navegación.
   ========================================================================== */
const VIEWPORT_BG_OPTIONS = [
  { label: 'Background-body-zero', value: '#FFFFFF' },
  { label: 'Background-body-default', value: '#F5F7F9' },
  { label: 'Background-body-strong', value: '#D9E0EA' },
  { label: 'Background-body-soft', value: '#FAFBFC' }
];

state.viewportBg = VIEWPORT_BG_OPTIONS[0].value;

function buildViewportBgPicker() {
  const wrap = document.getElementById('viewportBgPicker');
  wrap.innerHTML = '';
  VIEWPORT_BG_OPTIONS.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'viewport-bg-swatch' + (state.viewportBg === opt.value ? ' active' : '');

    const dot = document.createElement('span');
    dot.className = 'swatch-dot';
    dot.style.background = opt.value;

    const text = document.createElement('span');
    text.textContent = opt.label;

    btn.appendChild(dot);
    btn.appendChild(text);
    btn.addEventListener('click', () => {
      state.viewportBg = opt.value;
      document.getElementById('viewportWindow').style.background = opt.value;
      buildViewportBgPicker();
    });
    wrap.appendChild(btn);
  });
}

/* ==========================================================================
   REGISTRO DE COMPONENTES
   Cada componente nuevo que documentes se agrega aquí con su config.
   El sidebar de navegación se genera solo a partir de este objeto.
   ========================================================================== */
const componentRegistry = {
  'Tabs': tabsConfig,
  'Breadcrumb': breadcrumbConfig,
  'Chips': chipsConfig
  // Próximo: 'Chips group' (varios chips con control individual, ver nota en chipsConfig)
};

let activeComponentName = null;
let navCollapsed = false;

const NAV_CHEVRON_LEFT_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NAV_CHEVRON_RIGHT_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function buildNavSidebar() {
  const nav = document.getElementById('navSidebar');
  nav.innerHTML = '';
  nav.classList.toggle('collapsed', navCollapsed);

  const h2 = document.createElement('h2');
  h2.textContent = 'Componentes';
  nav.appendChild(h2);

  const list = document.createElement('div');
  list.className = 'nav-list';
  Object.keys(componentRegistry).sort((a, b) => a.localeCompare(b, 'es')).forEach(name => {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.title = name;
    btn.className = name === activeComponentName ? 'active' : '';
    btn.addEventListener('click', () => selectComponent(name));
    list.appendChild(btn);
  });
  nav.appendChild(list);
}

function selectComponent(name) {
  activeComponentName = name;
  buildNavSidebar();
  initEngine(componentRegistry[name]);
}

buildViewportBgPicker();
document.getElementById('viewportWindow').style.background = state.viewportBg;
selectComponent('Tabs');
window.addEventListener('resize', updateEdgeLines);
</script>
</body>
</html>
